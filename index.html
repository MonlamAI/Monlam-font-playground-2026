    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Monlam Fonts",
        "alternateName": ["Monlam Bodyig", "སྨོན་ལམ་བོད་ཡིག", "Monlam Font Playground", "Monlam Tibetan fonts"],
        "url": "https://monlamfonts.com/",
        "description": "Official Monlam IT Tibetan typeface playground and Monlam Bodyig download center.",
        "inLanguage": ["en", "bo"],
        "publisher": {
          "@type": "Organization",
          "name": "Monlam Tibetan IT Research Center"
        }
      }
    </script>
    <link rel="preload" href="/fonts/MonlamTBslim.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tibetan:wght@100..900&family=Noto+Serif+Tibetan:wght@100..900&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('monlam-theme');
          var dark = stored === 'dark';
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
        try {
          var loc = localStorage.getItem('monlam-ui-locale');
          document.documentElement.dataset.locale =
            loc === 'en' || loc === 'bo' ? loc : 'bo';
          document.documentElement.lang = loc === 'en' ? 'en' : 'bo';
        } catch (e2) {}
      })();
    </script>

  <body class="bg-gray-50 text-gray-900 antialiased selection:bg-blue-100 selection:text-blue-900 dark:bg-slate-950 dark:text-slate-100 dark:selection:bg-blue-900/60 dark:selection:text-blue-100">
