# Example nginx site fragment for monlamfonts.com
# Adjust paths, upstream port, and TLS certificate paths for your server.

upstream monlam_app {
  server 127.0.0.1:8787;
}

server {
  listen 443 ssl http2;
  server_name monlamfonts.com;

  # ssl_certificate ...
  # ssl_certificate_key ...

  # Required for admin keyboard .zip storage (Save), up to app limit (300 MB)
  client_max_body_size 300m;

  location / {
    proxy_pass http://monlam_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}

# Cloudflare note: orange-cloud proxy limits uploads to ~100 MB on Free/Pro.
# Options: grey-cloud DNS to this origin, Enterprise higher limit, or separate
# DNS-only host for /api admin uploads.
